# Kafka on EKS via the Strimzi operator (KRaft, no ZooKeeper).
# Install the operator first:
#   kubectl create namespace kafka
#   kubectl apply -n kafka -f https://strimzi.io/install/0.44.0?namespace=kafka
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: edgefleet
spec:
  replicas: 3
  roles: [controller, broker]
  storage:
    type: persistent-claim
    size: 50Gi
    class: gp3
    deleteClaim: true
  resources:
    requests: { cpu: "1", memory: 4Gi }
    limits: { memory: 4Gi }
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: edgefleet
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.8.0
    metadataVersion: 3.8-IV0
    listeners:
      - { name: plain, port: 9092, type: internal, tls: false }
      - name: external
        port: 9094
        type: loadbalancer
        tls: true
        configuration:
          bootstrap:
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-type: nlb
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      num.partitions: 12
  entityOperator:
    topicOperator: {}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: detections
  namespace: kafka
  labels:
    strimzi.io/cluster: edgefleet
spec:
  partitions: 12   # keyed by device_id; 12 partitions lets the consumer group scale to 12 pods
  replicas: 3
  config:
    retention.ms: 259200000   # 3 days
    compression.type: lz4
    min.insync.replicas: 2
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
