# Full local stack: Redis + LocalStack SQS + Kafka (KRaft) + control plane + simulator.
#   docker compose up --build
#   docker compose run --rm loadgen -rate 10000 -duration 1m
services:
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
    ports: ["4566:4566"]
    volumes:
      - ./deploy/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "get-queue-url", "--queue-name", "edgefleet-commands"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  control-plane:
    build: { context: ., args: { CMD: control-plane } }
    ports: ["8080:8080"]
    environment:
      REDIS_ADDR: redis:6379
      SQS_QUEUE_URL: http://localstack:4566/000000000000/edgefleet-commands
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      KAFKA_BROKERS: kafka:19092
      LOG_LEVEL: info
    depends_on:
      redis: { condition: service_started }
      kafka: { condition: service_started }
      localstack: { condition: service_healthy }

  simulator:
    build: { context: ., args: { CMD: simulator } }
    command: ["-n", "500", "-url", "http://control-plane:8080", "-events-per-sec", "1", "-kafka", "kafka:19092"]
    depends_on: [control-plane]

  loadgen:
    build: { context: ., args: { CMD: loadgen } }
    profiles: ["loadtest"]
    entrypoint: ["/app", "-brokers", "kafka:19092"]
    depends_on: [kafka]
